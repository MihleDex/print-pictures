name: Something is not working
description: Report a problem with Print Pictures
body:
  - type: input
    id: system
    attributes:
      label: System and version
      placeholder: Linux Mint 22.1, Cinnamon
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: File manager
      placeholder: Nemo, Files, Dolphin, Caja, Thunar
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer make and model
    validations:
      required: true
  - type: textarea
    id: printers
    attributes:
      label: Output of "print-pictures printers"
      description: Open a terminal, run `print-pictures printers`, and paste what it says. Remove anything you would rather not share.
      render: text
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
